[build-system]
# PEP 639 SPDX `license` / `license-files` metadata requires setuptools 77+.
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"


[project]
name = "fast-select"
version = "1.0.0"

authors = [
  { name="Gavin Lynch", email="gavinlynch04@gmail.com" },
]

description = "A Sci-Kit Learn compatible Numba and CUDA-accelerated implementation of various feature selection algorithms."

readme = "README.md"

requires-python = ">=3.9"

license = "MIT"
license-files = ["LICENSE"]

keywords = [
  "bioinformatics", "feature selection", "relief", "reliefF", "machine learning",
  "numba", "cuda", "gpu", "SURF", "MultiSURF", "TuRF", "SURF*", "MultiSURF*",
  "mRMR", "chi2", "CFS", "MDR", "mutual information"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.21",
    # numba.get_thread_id, used by the parallel CPU kernels, landed in 0.56.
    "numba>=0.56",
    # sklearn.utils.validation.validate_data was added in scikit-learn 1.6.
    "scikit-learn>=1.6",
    # scipy.stats.chi2 backs the Chi2 p-values, imported via fast_select/__init__.
    "scipy>=1.7",
]


[project.urls]
"Homepage" = "https://github.com/GavinLynch04/FastSelect"
"Documentation" = "https://fastselect.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/GavinLynch04/FastSelect/issues"
"Changelog" = "https://github.com/GavinLynch04/FastSelect/blob/main/CHANGELOG.md"


[project.optional-dependencies]
# The CUDA backend is built on numba.cuda, which needs an NVIDIA driver and a
# CUDA toolkit installed on the machine rather than a Python package. Nothing in
# fast_select imports CuPy, so this extra is intentionally empty and kept only so
# existing `pip install fast-select[gpu]` commands keep working.
gpu = []

test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pandas>=1.3",
    # Cross-check only; the paper-derived oracles in tests/ are authoritative.
    "skrebate>=0.6",
]

docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

dev = [
    "fast-select[gpu, test, docs]",
    "black>=23.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0",
]



[tool.setuptools.packages]
find = { where = ["src"] }


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=fast_select --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: test takes a long time to run",
    "gpu: test requires a CUDA-capable GPU",
]


[tool.black]
line-length = 120


[tool.ruff]
line-length = 120
# Archived exploratory notebooks/scripts kept for provenance, not maintained.
extend-exclude = ["benchmarking/old"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E731",
    # Module, class, and function names deliberately match the published
    # algorithm names (ReliefF.py, MultiSURF.py, mRMR, chi2, ...).
    "N801",
    "N802",
    "N803",
    "N806",
    "N811",
    "N814",
    "N999",
]

[tool.ruff.lint.isort]
known-first-party = ["fast_select"]
