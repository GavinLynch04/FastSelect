name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so the
# cuda-simulator job in python-tests.yml runs the kernels in the Numba CUDA
# simulator. This runs the CUDA backend tests with real PTX (no
# NUMBA_ENABLE_CUDASIM) on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior, races or real-device precision, so it
# complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [ development ]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-tests:
    name: CUDA tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Numba compiles the kernels to PTX with the toolkit's libNVVM, which it
      # finds through CUDA_HOME.
      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e ".[test]"

      # NUMBA_ENABLE_CUDASIM is not set, so the kernels are compiled to PTX
      # and run by the simulated H100. These files cover every CUDA kernel.
      # The five tests that only check the error raised when no GPU exists
      # are deselected, since they skip (by design) when a device is present.
      - name: Run the CUDA tests
        env:
          CUDA_HOME: /usr/local/cuda-13.0
        run: |
          vgpu run "$RUNNER_TEMP/venv/bin/python" -m pytest -ra --no-cov \
            --junitxml="$RUNNER_TEMP/junit.xml" \
            tests/test_gpu_cpu_parity.py tests/test_cuda_simulator.py \
            tests/test_exact_boundaries.py tests/test_mdr.py tests/test_mrmr.py \
            tests/test_cfs.py tests/test_chi2.py tests/test_surf.py \
            tests/test_multisurf.py tests/test_backend_selection.py \
            --deselect tests/test_mdr.py::test_backend_gpu_raises_without_cuda \
            --deselect tests/test_mrmr.py::test_gpu_backend_fails_without_cuda \
            --deselect tests/test_cfs.py::test_gpu_raises_error_if_unavailable \
            --deselect tests/test_surf.py::test_backend_error_handling \
            --deselect tests/test_multisurf.py::test_backend_error_handling

      # The GPU tests skip when no device is found, which would pass
      # silently. A skipped test is a failure here.
      - name: Fail on skipped tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP/junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse(sys.argv[1]).getroot()
          if suite.tag == "testsuites":
              suite = suite[0]
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          print(f"{tests} tests, {skipped} skipped")
          if tests == 0 or skipped:
              sys.exit("tests were skipped or none ran: the simulated GPU was not used")
          PY
