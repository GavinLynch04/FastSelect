name: JOSS Draft PDF

# Builds paper.md with the Open Journals toolchain JOSS itself uses, so the
# paper can be proofread before submission. Download the PDF from the run's
# artifacts. Runs only when the paper changes, or on demand.
on:
  push:
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper.pdf
          archive: false
