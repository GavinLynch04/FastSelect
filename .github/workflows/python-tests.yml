name: Python Tests

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]
  # Reused by publish-to-pypi.yml so a release is gated on the same checks.
  # Only the Codecov token is accepted; no other secret reaches this workflow.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "black>=23.0" "ruff>=0.1.0"

      - name: Run ruff
        run: ruff check src tests benchmarking

      - name: Run black
        run: black --check src tests benchmarking

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with pytest
        run: |
          pytest --cov=fast_select --cov-report=xml -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-py${{ matrix.python-version }}

  # Runs every CUDA kernel in the Numba CUDA simulator against the CPU backend
  # and the paper oracles. This checks kernel logic (indexing, reductions,
  # inequalities); it cannot detect driver, race, or real-device precision
  # problems, which still need a physical NVIDIA GPU.
  cuda-simulator:
    runs-on: ubuntu-latest
    env:
      NUMBA_ENABLE_CUDASIM: "1"
      NUMBA_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run CUDA-kernel tests in the simulator
        run: pytest tests/test_cuda_simulator.py tests/test_exact_boundaries.py -v --no-cov

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html

  packaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade pip
          pip install build "twine>=6.1"
          python -m build
          twine check --strict dist/*
